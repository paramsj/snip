<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>snip</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 48px auto; padding: 0 16px; color: #1c1e21; }
  input, select, button { font: inherit; padding: 10px; border: 1px solid #ccc; border-radius: 6px; width: 100%; margin-bottom: 8px; box-sizing: border-box; }
  button { background: #00add8; color: #fff; border: none; cursor: pointer; }
  #result { margin-top: 16px; }
  code { background: #f2f2f2; padding: 2px 6px; border-radius: 4px; word-break: break-all; }
</style>
</head>
<body>
<h1>✂️ snip</h1>
<p>Paste a long link, get a short one.</p>
<form id="form">
  <input id="url" placeholder="https://example.com/a/very/long/link" aria-label="Link to shorten" required>
  <input id="alias" placeholder="Custom name (optional)" aria-label="Custom name">
  <select id="expires" aria-label="Expires">
    <option value="0">Never expires</option>
    <option value="3600">Expires in 1 hour</option>
    <option value="86400">Expires in 1 day</option>
  </select>
  <button>Shorten</button>
</form>
<div id="result"></div>
<script>
document.getElementById("form").onsubmit = async (e) => {
  e.preventDefault();
  const res = await fetch("/api/links", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ url: url.value, alias: alias.value, expires_in: Number(expires.value) }),
  });
  const data = await res.json();
  const result = document.getElementById("result");
  result.textContent = "";
  if (!res.ok) { result.textContent = data.error; return; }
  const a = document.createElement("a");
  a.href = a.textContent = data.short_url;
  const token = document.createElement("code");
  token.textContent = data.delete_token;
  result.append("Your link: ", a, document.createElement("br"), "Delete token (keep it secret): ", token);
};
</script>
</body>
</html>
